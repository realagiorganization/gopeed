name: BDD

on:
  pull_request:
    branches: [ main ]
    paths:
      - "bdd/**"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/bdd.yml"
  push:
    branches: [ main ]
    paths:
      - "bdd/**"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/bdd.yml"
  workflow_dispatch:

env:
  GO_VERSION: "1.24"

jobs:
  bdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run BDD suite
        run: go test ./bdd -v
